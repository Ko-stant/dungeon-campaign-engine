services:
  postgres:
    image: postgres:18
    container_name: ${DB_CONTAINER:-hq_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so the
      # volume mounts the parent directory. pgdata18 is a fresh volume; the old
      # Postgres 16 volume (pgdata) is left untouched.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ${ADMINER_CONTAINER:-hq_adminer}
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

volumes:
  pgdata18:
