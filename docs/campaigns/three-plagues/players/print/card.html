<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Cards</title>
<link rel="stylesheet" href="print.css">
<style>
/* Option C, the half-page card: 5.5 x 8.5 in, two heroes per US Letter sheet in landscape, cut
   down the middle. Single-sided. Gear-affected stats are tiles (base, then + gear = total
   boxes); the fixed numbers sit in a strip; gear is a small ledger whose column totals feed the
   tiles. */
@page { size: letter landscape; margin: 0; }
.page { width: 11in; height: 8.5in; display: grid; grid-template-columns: 1fr 1fr; }
.cut { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed var(--ink-soft); }
.cut span { position: absolute; top: 0.15in; left: -0.13in; writing-mode: vertical-rl; background: #fff; padding: 0.05in 0; font-family: var(--label); font-size: 7pt; letter-spacing: 0.1em; color: var(--ink-soft); }

.card { padding: 0.32in 0.34in; display: grid; grid-template-rows: auto auto auto auto 1fr; gap: 0.11in; min-height: 0; }
.card header { display: grid; grid-template-columns: 1fr auto; align-items: end; border-bottom: 3px solid var(--hero); padding-bottom: 0.04in; }
.card header .name { font-size: 24pt; }
.card header .cls { font-size: 9pt; }

.upper { display: grid; grid-template-columns: 1.8in 1fr; gap: 0.16in; align-items: start; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.08in; }
.tile { border: 1px solid var(--rule); border-top: 3px solid var(--hero); border-radius: 3px; padding: 0.04in 0.07in 0.06in; display: grid; gap: 0.02in; }
.tile .lbl { font-family: var(--label); font-size: 7.5pt; letter-spacing: 0.06em; color: var(--ink-soft); }
.tile .calc { display: grid; grid-template-columns: auto auto 1fr auto 1fr; align-items: center; gap: 0.04in; }
.tile .base { font-size: 15pt; font-weight: 700; min-width: 0.32in; }
.tile .box { width: 100%; height: 0.3in; }
.tile .caps { display: grid; grid-template-columns: auto auto 1fr auto 1fr; gap: 0.04in; font-family: var(--label); font-size: 6pt; letter-spacing: 0.05em; color: var(--ink-soft); }
.tile .caps span { text-align: center; }
.det { display: flex; align-items: center; gap: 0.06in; font-size: 8pt; margin-top: 0.06in; grid-column: 1 / -1; }
.det .check { width: 0.14in; height: 0.14in; }
.reach { font-size: 7.6pt; font-style: italic; color: var(--ink-soft); line-height: 1.25; grid-column: 1 / -1; }

.strip { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--rule); border-radius: 3px; }
.strip div { padding: 0.03in 0.06in; display: grid; }
.strip div + div { border-left: 1px solid var(--rule); }
.strip span { font-family: var(--label); font-size: 6.5pt; letter-spacing: 0.05em; color: var(--ink-soft); white-space: nowrap; }
.strip b { font-size: 10.5pt; font-weight: 700; }

h2.sec { font-family: var(--label); font-weight: 700; font-size: 8pt; letter-spacing: 0.12em; color: var(--hero); border-bottom: 1px solid var(--rule); padding-bottom: 0.02in; margin-bottom: 0.04in; }
.abilities { font-size: 7.9pt; line-height: 1.22; display: grid; gap: 0.035in; }
.abilities .ab-tag { font-size: 6.6pt; margin-left: 0.03in; }

table.gear { width: 100%; border-collapse: collapse; }
table.gear th { font-family: var(--label); font-weight: 500; font-size: 6.5pt; letter-spacing: 0.05em; color: var(--ink-soft); text-align: center; }
table.gear th.item { text-align: left; }
table.gear td { height: 0.27in; border-bottom: 1px solid var(--rule); }
table.gear td.n { width: 0.4in; border-left: 1px solid var(--rule); }
table.gear td.eq { width: 0.22in; }
table.gear td.eq .check { width: 0.13in; height: 0.13in; }
table.gear tfoot td { border-bottom: none; padding-top: 0.04in; text-align: center; height: auto; }
table.gear tfoot td.lbl { text-align: right; font-family: var(--label); font-size: 7pt; color: var(--ink-soft); padding-right: 0.06in; }
table.gear tfoot .box { width: 0.36in; height: 0.25in; }
</style>
</head>
<body>
<main id="pages"></main>
<script src="heroes.js"></script>
<script>
function card(hero) {
  const tiles = h("div.tiles",
    hero.boxed.map(([label, base]) => h("div.tile",
      h("div.lbl", label),
      h("div.calc", h("span.base.num", base), h("span.op", "+"), h("span.box"), h("span.op", "="), h("span.box.total")),
      h("div.caps", h("span", { style: "min-width:0.32in" }), h("span", { style: "visibility:hidden" }, "+"), h("span", "gear"), h("span", { style: "visibility:hidden" }, "="), h("span", "total")))),
    h("div.det", h("b", "Determination"), h("span.check"), "+2", h("span.check"), "+4"),
    h("p.reach", hero.reach));

  return h("article.card", { style: `--hero:${hero.color}` },
    h("header", h("h1.name", hero.name), h("div.cls", hero.cls)),
    h("div.upper", h("img.art", { src: hero.art, alt: `${hero.name}'s hero card` }), tiles),
    h("div.strip", hero.fixed.map(([l, v]) => h("div", h("span", l), h("b.num", v)))),
    h("div", h("h2.sec", "Abilities"),
      h("div.abilities", hero.abilities.map(([name, tag, text]) => h("p",
        h("span.ab-name", name), h("span.ab-tag", tag), " ", text)))),
    h("div", h("h2.sec", "Gear"),
      h("table.gear",
        h("thead", h("tr", h("th"), h("th.item", "Item"), hero.gearCols.map(c => h("th", c)))),
        h("tbody", Array.from({ length: 5 }, () => h("tr", h("td.eq", h("span.check")), h("td"), hero.gearCols.map(() => h("td.n"))))),
        h("tfoot", h("tr", h("td.lbl", { colspan: 2 }, "Equipped total"), hero.gearCols.map(() => h("td", h("span.box"))))))));
}

for (let i = 0; i < HEROES.length; i += 2) {
  document.getElementById("pages").append(h("section.page",
    HEROES.slice(i, i + 2).map(card),
    h("div.cut", h("span", "CUT"))));
}
</script>
</body>
</html>
