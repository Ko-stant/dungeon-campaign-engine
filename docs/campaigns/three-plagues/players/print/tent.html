<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Tents</title>
<link rel="stylesheet" href="print.css">
<style>
/* Option B, the table tent: one US Letter sheet in landscape per hero, folded along the middle
   so it stands like a place card. The top half is printed upside down and faces the table (art,
   name, what the hero can do); the bottom half faces the player: stats with pencil boxes,
   abilities and gear lines. */
@page { size: letter landscape; margin: 0; }
.page { width: 11in; height: 8.5in; display: grid; grid-template-rows: 1fr 1fr; }
.face { padding: 0.32in 0.45in; min-height: 0; overflow: hidden; }
.outward { transform: rotate(180deg); display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.35in; align-items: center; }
.fold { position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--ink-soft); }
.fold::after { content: ""; position: absolute; left: 0.45in; right: 0.45in; top: 0.12in; height: 4px; background: var(--hero); }
.fold span { position: absolute; right: 0.2in; top: -0.08in; background: #fff; padding: 0 0.06in; font-family: var(--label); font-size: 7pt; letter-spacing: 0.1em; color: var(--ink-soft); }

.outward .art { height: 3.55in; width: auto; }
.outward .who { text-align: right; display: grid; gap: 0.06in; }
.outward .who .cls { font-size: 13pt; }
.outward .who .name { font-size: 34pt; }
.outward .who .rule { height: 3px; background: var(--hero); width: 1.4in; justify-self: end; }
.outward .can { display: grid; gap: 0.05in; align-content: center; }
.outward .can h2 { font-family: var(--label); font-size: 9pt; letter-spacing: 0.12em; color: var(--hero); font-weight: 700; }
.outward .can p { font-size: 11pt; line-height: 1.25; }
.outward .can p span { font-family: var(--label); font-size: 8pt; color: var(--ink-soft); letter-spacing: 0.04em; }

.player { display: grid; grid-template-columns: 3.2in 1fr 2.55in; gap: 0.3in; padding-top: 0.38in; }
.col h2 { font-family: var(--label); font-weight: 700; font-size: 8.5pt; letter-spacing: 0.12em; color: var(--hero); border-bottom: 1px solid var(--rule); padding-bottom: 0.02in; margin-bottom: 0.06in; }
.head { display: flex; align-items: baseline; gap: 0.1in; margin-bottom: 0.06in; }
.head .name { font-size: 18pt; }
.head .cls { font-size: 8.5pt; }
.fixed { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0.02in 0.16in; font-size: 9pt; margin-bottom: 0.08in; }
.fixed span { font-family: var(--label); font-size: 7.5pt; color: var(--ink-soft); letter-spacing: 0.04em; }
.fixed b { font-weight: 700; }
.row { display: grid; grid-template-columns: 1fr 0.38in 0.16in 0.5in 0.16in 0.55in; align-items: center; height: 0.34in; border-top: 1px solid var(--rule); font-size: 10pt; }
.row.caps { height: auto; border-top: none; font-family: var(--label); font-size: 7pt; letter-spacing: 0.05em; color: var(--ink-soft); }
.row.caps span:nth-child(4), .row.caps span:nth-child(6) { text-align: center; }
.row b { font-weight: 700; }
.row small { font-size: 7pt; color: var(--ink-soft); display: block; line-height: 1; }
.row .base { text-align: center; font-weight: 700; font-size: 11.5pt; }
.row .op { text-align: center; font-size: 10pt; }
.row .box { width: 0.48in; height: 0.27in; }
.row .box.total { width: 0.53in; }
.det { display: flex; align-items: center; gap: 0.06in; font-size: 8pt; margin-top: 0.06in; }
.det .check { width: 0.14in; height: 0.14in; }

.abilities { font-size: 8.9pt; line-height: 1.25; display: grid; gap: 0.045in; }
.abilities .ab-tag { font-size: 7pt; margin-left: 0.03in; }
.reach { font-size: 7.8pt; font-style: italic; color: var(--ink-soft); margin-top: 0.03in; }

.gear-row { display: grid; grid-template-columns: 0.2in 1fr 0.7in; gap: 0.06in; align-items: end; height: 0.32in; border-bottom: 1px solid var(--rule); }
.gear-row .check { width: 0.13in; height: 0.13in; margin-bottom: 0.05in; }
.gear-row .bonus { border-left: 1px solid var(--rule); height: 100%; }
.gear-caps { display: grid; grid-template-columns: 0.2in 1fr 0.7in; gap: 0.06in; font-family: var(--label); font-size: 7pt; letter-spacing: 0.05em; color: var(--ink-soft); }
.gear-note { font-size: 7.5pt; color: var(--ink-soft); margin-top: 0.05in; line-height: 1.25; }
</style>
</head>
<body>
<main id="pages"></main>
<script src="heroes.js"></script>
<script>
for (const hero of HEROES) {
  const outward = h("div.face.outward",
    h("div.who", h("div.cls", hero.cls), h("h1.name", hero.name), h("div.rule")),
    h("img.art", { src: hero.art, alt: `${hero.name}'s hero card` }),
    h("div.can", h("h2", "Can do"),
      hero.abilities.map(([name, tag]) => h("p", name, " ", h("span", tag.split(" · ")[0])))));

  const stats = h("div.col",
    h("div.head", h("span.name", hero.name), h("span.cls", hero.cls)),
    h("div.fixed", hero.fixed.map(([l, v]) => h("div", h("span", l), " ", h("b.num", v)))),
    h("div.row.caps", h("span", "Stat"), h("span", { style: "text-align:center" }, "Base"), h("span"), h("span", "Gear"), h("span"), h("span", "Total")),
    hero.boxed.map(([label, base, note]) => h("div.row",
      h("div", h("b", label), note && h("small", note)),
      h("span.base.num", base), h("span.op", "+"), h("span.box"), h("span.op", "="), h("span.box.total"))),
    h("div.det", h("b", "Determination"), h("span.check"), "+2", h("span.check"), "+4"));

  const abilities = h("div.col",
    h("h2", "Abilities"),
    h("div.abilities", hero.abilities.map(([name, tag, text]) => h("p",
      h("span.ab-name", name), h("span.ab-tag", tag), " ", text))),
    h("p.reach", hero.reach));

  const gear = h("div.col",
    h("h2", "Gear"),
    h("div.gear-caps", h("span", "Eq."), h("span", "Item"), h("span", "Bonus")),
    Array.from({ length: 8 }, () => h("div.gear-row", h("span.check"), h("span"), h("span.bonus"))),
    h("p.gear-note", "Fill the circle for equipped gear. Write each bonus as \"+2 Avoid\"; add them up per stat for the Gear boxes."));

  document.getElementById("pages").append(h("section.page", { style: `--hero:${hero.color}` },
    outward,
    h("div.face.player", stats, abilities, gear),
    h("div.fold", h("span", "FOLD"))));
}
</script>
</body>
</html>
