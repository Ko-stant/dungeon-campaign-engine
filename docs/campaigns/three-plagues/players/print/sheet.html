<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Sheets</title>
<link rel="stylesheet" href="print.css">
<style>
/* Option A, the hero sheet: one US Letter page per hero, everything on one side. Art and a
   stat ledger (Base | + Gear | = Total) on top, abilities in two columns, then a gear ledger
   whose column totals feed the + Gear boxes. */
@page { size: letter portrait; margin: 0; }
.page { width: 8.5in; height: 11in; padding: 0.4in 0.5in; display: grid; grid-template-rows: auto auto auto 1fr; gap: 0.14in; }

header.top { display: grid; grid-template-columns: 1fr auto; align-items: end; border-bottom: 3px solid var(--hero); padding-bottom: 0.06in; }
header.top .cls { font-size: 11pt; }
header.top .name { font-size: 36pt; }
header.top .campaign { font-family: var(--label); font-size: 9pt; letter-spacing: 0.1em; color: var(--ink-soft); text-align: right; }

.upper { display: grid; grid-template-columns: 2.55in 1fr; gap: 0.25in; align-items: start; }
.right { display: grid; gap: 0.14in; }
.fixed { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.06in; }
.fixed div { border: 1px solid var(--rule); border-radius: 3px; padding: 0.03in 0.08in; display: grid; }
.fixed span { font-family: var(--label); font-size: 7.5pt; letter-spacing: 0.06em; color: var(--ink-soft); }
.fixed b { font-size: 13pt; font-weight: 700; line-height: 1.15; }

table.ledger { width: 100%; border-collapse: collapse; }
table.ledger th, table.ledger td { padding: 0.02in 0.05in; text-align: center; vertical-align: middle; }
table.ledger thead th { font-family: var(--label); font-weight: 500; font-size: 7.5pt; letter-spacing: 0.06em; color: var(--ink-soft); border-bottom: 1.5px solid var(--hero); }
table.ledger tbody th { text-align: left; font-size: 11pt; font-weight: 700; }
table.ledger tbody th small { display: block; font-weight: 400; font-size: 7.5pt; color: var(--ink-soft); }
table.ledger tbody tr + tr { border-top: 1px solid var(--rule); }
table.ledger td.base { font-size: 14pt; font-weight: 700; width: 0.65in; }
table.ledger td.op { font-size: 13pt; width: 0.2in; padding: 0; }
table.ledger .box { width: 0.62in; height: 0.3in; }
table.ledger .box.total { width: 0.7in; }

.rolls { display: grid; gap: 0.03in; font-size: 8.5pt; color: var(--ink-soft); }
.rolls b { color: var(--ink); }
.det { display: flex; align-items: center; gap: 0.08in; font-size: 8.5pt; }
.det .check { width: 0.17in; height: 0.17in; }
.left { display: grid; gap: 0.08in; }
.reach { font-size: 8.5pt; font-style: italic; color: var(--ink-soft); }

h2.sec { font-family: var(--label); font-weight: 700; font-size: 9pt; letter-spacing: 0.12em; color: var(--hero); border-bottom: 1px solid var(--rule); padding-bottom: 0.03in; margin-bottom: 0.06in; }
.abilities { columns: 2; column-gap: 0.3in; font-size: 8.75pt; line-height: 1.28; }
.ability { break-inside: avoid; margin-bottom: 0.07in; }
.ability .ab-tag { font-size: 7.5pt; margin-left: 0.04in; }

table.gear { width: 100%; border-collapse: collapse; }
table.gear th { font-family: var(--label); font-weight: 500; font-size: 7.5pt; letter-spacing: 0.06em; color: var(--ink-soft); text-align: center; padding-bottom: 0.03in; }
table.gear th.item { text-align: left; }
table.gear td { height: 0.3in; border-bottom: 1px solid var(--rule); }
table.gear td.n { width: 0.55in; border-left: 1px solid var(--rule); }
table.gear td.eq { width: 0.3in; text-align: center; }
table.gear td.eq .check { width: 0.15in; height: 0.15in; }
table.gear tfoot td { border-bottom: none; padding-top: 0.06in; text-align: center; }
table.gear tfoot td.lbl { text-align: right; font-family: var(--label); font-size: 8pt; letter-spacing: 0.04em; color: var(--ink-soft); padding-right: 0.08in; }
table.gear tfoot .box { width: 0.45in; height: 0.3in; }
.gear-note { font-size: 8pt; color: var(--ink-soft); margin-top: 0.05in; }
</style>
</head>
<body>
<main id="pages"></main>
<script src="heroes.js"></script>
<script>
for (const hero of HEROES) {
  const ledger = h("table.ledger",
    h("thead", h("tr", h("th", { style: "text-align:left" }, "Stat"), h("th", "Base"), h("th"), h("th", "Gear"), h("th"), h("th", "Total"))),
    h("tbody", hero.boxed.map(([label, base, note]) => h("tr",
      h("th", label, note && h("small", note)),
      h("td.base.num", base),
      h("td.op", h("span.op", "+")),
      h("td", h("span.box")),
      h("td.op", h("span.op", "=")),
      h("td", h("span.box.total")),
    ))));

  const gearRows = Array.from({ length: 6 }, () => h("tr",
    h("td.eq", h("span.check")), h("td"), hero.gearCols.map(() => h("td.n"))));

  const page = h("section.page", { style: `--hero:${hero.color}` },
    h("header.top",
      h("div", h("div.cls", hero.cls), h("h1.name", hero.name)),
      h("div.campaign", "The Three Plagues")),
    h("div.upper",
      h("div.left",
        h("img.art", { src: hero.art, alt: `${hero.name}'s hero card` }),
        h("p.reach", hero.reach)),
      h("div.right",
        h("div.fixed", hero.fixed.map(([l, v]) => h("div", h("span", l), h("b.num", v)))),
        ledger,
        h("div.rolls",
          h("p", h("b", "Hit roll:"), " hit dice + Accuracy total; meet or beat the monster's Avoidance."),
          h("p", h("b", "Defense:"), " defense dice + Avoidance total; the monster must beat it (ties go to you)."),
          h("p", h("b", "Hits on you:"), " their damage minus your Mitigation total.")),
        h("div.det", h("b", "Determination"), h("span.check"), "+2", h("span.check"), "+4",
          h("span", { style: "color:var(--ink-soft)" }, "(one per miss in a row; any hit resets it)")))),
    h("div",
      h("h2.sec", "Abilities"),
      h("div.abilities", hero.abilities.map(([name, tag, text]) => h("p.ability",
        h("span.ab-name", name), h("span.ab-tag", tag), h("br"), text)))),
    h("div.lower",
      h("div",
        h("h2.sec", "Gear"),
        h("table.gear",
          h("thead", h("tr", h("th", "Eq."), h("th.item", "Item"), hero.gearCols.map(c => h("th", c)))),
          h("tbody", gearRows),
          h("tfoot", h("tr", h("td.lbl", { colspan: 2 }, "Equipped gear total"), hero.gearCols.map(() => h("td", h("span.box"))))),
        ),
        h("p.gear-note", "Fill the circle for gear you have equipped. Add up each column for the equipped gear and copy it into the Gear box above."))),
  );
  document.getElementById("pages").append(page);
}
</script>
</body>
</html>
